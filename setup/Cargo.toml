[package]
name = "nextar-setup"
version = "0.3.2"
edition = "2021"
authors = ["Michael Rieger"]
description = "nextar installer: bundles nextar.exe + nextar-gui.exe and registers Explorer shell integration"
build = "build.rs"

[[bin]]
name = "nextar-setup"
path = "src/main.rs"

[dependencies]
winreg = "0.52"
anyhow = "1"
eframe = "0.36.1"
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Decodes the embedded raster logo (resources/logo-master.png) at startup
# so the wizard painter can draw the brand mark as a texture.
png = "0.18"

[target.'cfg(windows)'.dependencies]
# Native window chrome: title bar follows the app palette via DWM attributes.
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_UI_Shell"] }

[build-dependencies]
embed-resource = "2"

[profile.release]
lto = true
codegen-units = 1
