name: nightly

# Publishes a rolling "nightly" build to a GitHub Release tagged `nightly`
# on every push to master and once a day (UTC) so a build exists even on
# quiet days. Asset names are FIXED (`nextar-setup.exe`, `nextar-macos.dmg`),
# so the landing page can link the latest build with a stable URL:
#
#   https://github.com/<owner>/<repo>/releases/download/nightly/nextar-setup.exe
#   https://github.com/<owner>/<repo>/releases/download/nightly/nextar-macos.dmg
#
# The tag/release is updated in place on each run (overwrite_files: true),
# so the URLs always serve the newest build. The release body carries the
# commit subject, test results and SHA-256 checksums (read by the landing
# page's live badges). Versioned builds ship separately via the release
# workflow.

on:
  push:
    branches: [master]
  schedule:
    - cron: '37 4 * * *' # daily at 04:37 UTC (staggered from CI's 05:17)

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Tests must pass; the summary is captured for the release body. The
      # log is dumped on failure so a broken test/compile is diagnosable
      # instead of being swallowed by bash -e. The setup crate embeds
      # target/release/nextar.exe + nextar-gui.exe via include_bytes!, so the
      # payload must be built before tests run (cargo caches it for the
      # later package.sh step).
      - name: Run tests and collect summary
        shell: bash
        run: |
          cargo build --release --bin nextar --bin nextar-gui
          set +e
          cargo test > "$RUNNER_TEMP/tests.log" 2>&1
          RC1=$?
          cargo test --manifest-path setup/Cargo.toml >> "$RUNNER_TEMP/tests.log" 2>&1
          RC2=$?
          set -e
          if [ $RC1 -ne 0 ] || [ $RC2 -ne 0 ]; then
            echo "--- tests.log tail ---"
            tail -n 120 "$RUNNER_TEMP/tests.log"
            exit 1
          fi
          grep -h '^test result:' "$RUNNER_TEMP/tests.log" | sed 's/^test result: //' > summary-windows.txt
          cat summary-windows.txt

      # Timeout: package.sh historically hung on the (now CI-skipped) signing
      # step; the cap turns any future hang into a visible failure instead of
      # a 6h runner bill.
      - name: Build installer distribution
        shell: bash
        timeout-minutes: 40
        run: bash scripts/package.sh

      - name: Checksum the installer
        shell: pwsh
        run: |
          $h = Get-FileHash dist/nextar-setup.exe -Algorithm SHA256
          '{0}  nextar-setup.exe' -f $h.Hash.ToLower() | Set-Content nextar-setup.exe.sha256
          Get-Content nextar-setup.exe.sha256

      # Stage into a FLAT directory before upload. upload-artifact@v4 keeps the
      # common root across all paths; mixing dist/ files with workspace-root
      # files used to preserve the 'dist/' prefix, so the publish job's globs
      # (assets/nextar-setup.exe) matched nothing and the release silently
      # ended up with zero assets after overwrite_files ran.
      - name: Stage installer payload (flat)
        shell: bash
        run: |
          mkdir -p staging
          cp dist/nextar-setup.exe staging/
          cp summary-windows.txt staging/
          cp nextar-setup.exe.sha256 staging/
          ls -la staging/

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-windows
          path: staging/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests and collect summary
        shell: bash
        run: |
          cargo test > "$RUNNER_TEMP/tests.log" 2>&1
          grep -h '^test result:' "$RUNNER_TEMP/tests.log" | sed 's/^test result: //' > summary-macos.txt
          cat summary-macos.txt

      - name: Build the .dmg
        run: bash installers/macos/build-dmg.sh

      # Fixed asset name so the nightly download URL never changes across
      # versions (the dmg pipeline names it nextar-<version>-macos.dmg).
      - name: Normalize the dmg name
        run: |
          mv dist/*.dmg dist/nextar-macos.dmg
          ls -la dist/nextar-macos.dmg

      - name: Checksum the dmg
        shell: bash
        run: |
          shasum -a 256 dist/nextar-macos.dmg | awk '{print $1"  nextar-macos.dmg"}' > nextar-macos.dmg.sha256
          cat nextar-macos.dmg.sha256

      # Same flat staging as the windows job (see comment there): the artifact
      # must contain nextar-macos.dmg at its root or the publish glob fails.
      - name: Stage dmg payload (flat)
        shell: bash
        run: |
          mkdir -p staging
          cp dist/nextar-macos.dmg staging/
          cp summary-macos.txt staging/
          cp nextar-macos.dmg.sha256 staging/
          ls -la staging/

      - uses: actions/upload-artifact@v4
        with:
          name: nightly-macos
          path: staging/*

  # Creates (or updates in place) the nightly release with both artifacts
  # and a rich body: commit subject, test results, SHA-256 checksums.
  publish:
    runs-on: ubuntu-latest
    needs: [windows, macos]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nightly-windows
          path: assets/
      - uses: actions/download-artifact@v4
        with:
          name: nightly-macos
          path: assets/

      - name: Assemble release body
        shell: bash
        env:
          SHA: ${{ github.sha }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          SUBJECT="$(printf '%s' "$MSG" | head -n1)"
          SHORT="${SHA:0:7}"
          WIN_TESTS="$(awk 'NR>1{printf " | "} {printf "%s", $0} END{print ""}' assets/summary-windows.txt)"
          MAC_TESTS="$(awk 'NR>1{printf " | "} {printf "%s", $0} END{print ""}' assets/summary-macos.txt)"
          WIN_SHA="$(awk '{print $1}' assets/nextar-setup.exe.sha256)"
          MAC_SHA="$(awk '{print $1}' assets/nextar-macos.dmg.sha256)"
          cat > body.md <<EOF
          Rolling build from \`master\` — ${SUBJECT}

          - commit: ${SHA}
          - subject: ${SUBJECT}
          - run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          **tests**
          - windows: ${WIN_TESTS}
          - macos: ${MAC_TESTS}

          **checksums (SHA-256)**
          - nextar-setup.exe: ${WIN_SHA}
          - nextar-macos.dmg: ${MAC_SHA}
          EOF
          echo "--- body.md ($(wc -c < body.md) bytes) ---"
          cat body.md

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nextar nightly
          prerelease: true
          overwrite_files: true
          # Never silently publish an empty release: if the staged files are
          # missing (e.g. an upload-path regression), fail loudly instead of
          # wiping the previous nightly's assets.
          fail_on_unmatched_files: true
          body_path: ${{ github.workspace }}/body.md
          files: |
            assets/nextar-setup.exe
            assets/nextar-macos.dmg

      # Post-publish guard: softprops only verifies the LOCAL files matched.
      # This asserts the release actually serves them - both stable download
      # URLs must answer 200, the release must carry exactly the two expected
      # assets, and each served file's SHA-256 must equal the staged checksum
      # - so a regression like the dist/-prefix bug fails the nightly run
      # instead of silently shipping a 404 (or wrong bytes) to the landing
      # page and the smoke runner.
      - name: Verify nightly release serves the assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Releases are visible to the API/downloads almost immediately, but
          # retry briefly in case of propagation lag.
          EXE_CODE=000
          DMG_CODE=000
          for _ in $(seq 1 10); do
            EXE_CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "https://github.com/${{ github.repository }}/releases/download/nightly/nextar-setup.exe")
            DMG_CODE=$(curl -sIL -o /dev/null -w '%{http_code}' "https://github.com/${{ github.repository }}/releases/download/nightly/nextar-macos.dmg")
            [ "$EXE_CODE" = "200" ] && [ "$DMG_CODE" = "200" ] && break
            sleep 5
          done
          echo "nextar-setup.exe -> $EXE_CODE"
          echo "nextar-macos.dmg  -> $DMG_CODE"
          [ "$EXE_CODE" = "200" ] || { echo "::error::nightly nextar-setup.exe download returned $EXE_CODE"; exit 1; }
          [ "$DMG_CODE" = "200" ] || { echo "::error::nightly nextar-macos.dmg download returned $DMG_CODE"; exit 1; }

          gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.assets[].name' > /tmp/nightly-assets.txt
          echo "--- release assets ---"
          cat /tmp/nightly-assets.txt
          grep -qx 'nextar-setup.exe' /tmp/nightly-assets.txt || { echo "::error::nextar-setup.exe missing from nightly release"; exit 1; }
          grep -qx 'nextar-macos.dmg' /tmp/nightly-assets.txt || { echo "::error::nextar-macos.dmg missing from nightly release"; exit 1; }
          COUNT=$(wc -l < /tmp/nightly-assets.txt)
          echo "asset count: $COUNT"
          # The screenshots workflow uploads six gallery PNGs (stable names,
          # --clobber) after this build, so the release may hold 2 or 8
          # assets depending on whether it has run yet. Reject anything
          # outside that known set so a stray/unexpected asset still fails.
          # The screenshots workflow uploads six gallery PNGs plus the demo
          # GIF (stable names, --clobber) after this build, so the release
          # may hold 2, 8 or 9 assets depending on whether it has run yet.
          # Reject anything outside that known set so a stray/unexpected
          # asset still fails.
          [ "$COUNT" -eq 2 ] || [ "$COUNT" -eq 8 ] || [ "$COUNT" -eq 9 ] || { echo "::error::expected 2 binaries (+6 gallery pngs +1 gif), found $COUNT assets"; exit 1; }

          # Byte-for-byte: the bytes GitHub serves must match the checksums
          # computed from the staged payloads earlier in this job.
          curl -fL -o /tmp/nightly-setup.exe "https://github.com/${{ github.repository }}/releases/download/nightly/nextar-setup.exe"
          curl -fL -o /tmp/nightly-macos.dmg "https://github.com/${{ github.repository }}/releases/download/nightly/nextar-macos.dmg"
          EXE_SERVED=$(sha256sum /tmp/nightly-setup.exe | awk '{print $1}')
          DMG_SERVED=$(sha256sum /tmp/nightly-macos.dmg | awk '{print $1}')
          EXE_EXPECTED=$(awk '{print $1}' assets/nextar-setup.exe.sha256)
          DMG_EXPECTED=$(awk '{print $1}' assets/nextar-macos.dmg.sha256)
          echo "nextar-setup.exe served=$EXE_SERVED expected=$EXE_EXPECTED"
          echo "nextar-macos.dmg  served=$DMG_SERVED expected=$DMG_EXPECTED"
          [ "$EXE_SERVED" = "$EXE_EXPECTED" ] || { echo "::error::nextar-setup.exe checksum mismatch"; exit 1; }
          [ "$DMG_SERVED" = "$DMG_EXPECTED" ] || { echo "::error::nextar-macos.dmg checksum mismatch"; exit 1; }

          # Body must match the staged checksums too, so the landing page
          # badges (which read them from the release body) show the same
          # hashes as the files being served.
          BODY=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.body')
          # Body line format is `- nextar-setup.exe: <sha256>` → checksum is
          # field 3 (field 2 is the `nextar-setup.exe:` name).
          EXE_BODY=$(printf '%s' "$BODY" | grep -m1 'nextar-setup.exe:' | awk '{print $3}')
          DMG_BODY=$(printf '%s' "$BODY" | grep -m1 'nextar-macos.dmg:' | awk '{print $3}')
          echo "body: nextar-setup.exe=$EXE_BODY nextar-macos.dmg=$DMG_BODY"
          [ "$EXE_BODY" = "$EXE_EXPECTED" ] || { echo "::error::release body nextar-setup.exe checksum mismatch (badge would lie)"; exit 1; }
          [ "$DMG_BODY" = "$DMG_EXPECTED" ] || { echo "::error::release body nextar-macos.dmg checksum mismatch (badge would lie)"; exit 1; }
          echo "✅ nightly release verified: downloads 200, served + body checksums match"
