name: screenshots

# Captures fresh screenshots of the running GUI and uploads them to the
# `nightly` release so the release gallery and README never go stale. Runs
# on a schedule (staggered after the nightly build at 04:37 UTC) and on
# demand via workflow_dispatch.
#
# The upload uses stable asset names (nextar-home.png, nextar-create.png,
# …) with --clobber, so URLs like
#   https://github.com/<owner>/<repo>/releases/download/nightly/nextar-home.png
# always serve the newest capture. The nightly job's post-publish verify
# accepts exactly these six gallery assets alongside the two binaries.
#
# Requires a desktop session (CopyFromScreen): windows-latest runners run
# interactively, so this works. The runner must also have a working GUI
# launch — the capture script waits for the main window to settle before
# navigating.

on:
  schedule:
    - cron: '20 5 * * *' # daily at 05:20 UTC (after nightly's 04:37 build)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # The GUI is captured from the freshly built exe (not the installed
      # copy), and the sample archive is created with the CLI from the
      # committed fixtures so the Inspect view has real content.
      - name: Build the binaries
        shell: bash
        run: |
          cargo build --release --bin nextar --bin nextar-gui
          ./target/release/nextar.exe create screenshots/fixtures -o sample.next
          ./target/release/nextar.exe list sample.next

      # ffmpeg powers the animated demo GIF. setup-ffmpeg@v3 is the standard
      # action but has been flaky in the past; if it fails to put ffmpeg on
      # PATH, fall back to winget so the GIF step still runs.
      - name: Install ffmpeg
        id: ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        continue-on-error: true

      - name: Ensure ffmpeg (fallback)
        if: steps.ffmpeg.outcome == 'failure'
        shell: pwsh
        run: |
          winget install --id Gyan.FFmpeg -e --accept-source-agreements --accept-package-agreements --disable-interactivity
          $ff = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if ($ff) { Write-Host "ffmpeg found: $($ff.FullName)" } else { throw "ffmpeg not found after winget install" }

      - name: Capture all views
        shell: pwsh
        env:
          SEED: "screenshots/fixtures/README.md;screenshots/fixtures/data.json;screenshots/fixtures/notes.txt;screenshots/fixtures/src/main.rs"
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/capture-screenshots.ps1 `
            -Exe "$env:GITHUB_WORKSPACE/target/release/nextar-gui.exe" `
            -OutDir "$env:GITHUB_WORKSPACE/staging" `
            -ArchiveArg "sample.next" `
            -Seed "$env:SEED"

      # Animated demo GIF: same launch, but grabs the splash + Home entrance
      # and view transitions as frames, then assembles with ffmpeg. If the
      # runner has no ffmpeg this is skipped (the committed GIF is uploaded
      # unchanged) rather than failing the whole screenshot job.
      - name: Capture demo GIF
        shell: pwsh
        run: |
          $ff = (Get-Command ffmpeg -ErrorAction SilentlyContinue)
          if (-not $ff) {
            $ffPath = Get-ChildItem "$env:LOCALAPPDATA\Microsoft\WinGet\Packages" -Recurse -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($ffPath) { $ff = $ffPath.FullName }
          }
          if (-not $ff) { Write-Host "ffmpeg unavailable - keeping committed GIF"; exit 0 }
          $ffBin = if ($ff -is [string]) { $ff } else { $ff.Source }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/capture-gif.ps1 `
            -Exe "$env:GITHUB_WORKSPACE/target/release/nextar-gui.exe" `
            -Out "$env:GITHUB_WORKSPACE/screenshots/nextar-demo.gif" `
            -Ffmpeg "$ffBin"
          if ($LASTEXITCODE -ne 0) { Write-Host "gif capture failed - keeping committed GIF"; exit 0 }

      - name: Upload to the nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for f in nextar-home nextar-create nextar-extract nextar-inspect nextar-repair nextar-settings; do
            gh release upload nightly "staging/$f.png" --clobber
            echo "uploaded $f.png"
          done
          # The demo GIF is committed (screenshots/nextar-demo.gif); re-upload
          # it so the nightly gallery URL serves the current branding.
          gh release upload nightly screenshots/nextar-demo.gif --clobber
          echo "uploaded nextar-demo.gif"
          gh release view nightly --json assets --jq '[.assets[].name]'
