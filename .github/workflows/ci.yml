name: ci

# Runs on every push to master, every pull request, and once a day (UTC) as
# the scheduled smoke test. The Windows job builds all three binaries, runs
# the Rust test suites, then installs to a throwaway prefix and drives the
# real Explorer shell integration - registry verbs, Explorer verb
# resolution, and actual verb invocations (compress / extract / repair,
# including the encrypted-repair scenario) - via verify-shell.ps1 -Run and
# the scheduled smoke-test runner.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 5 * * *' # daily at 05:17 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # The logo is procedural (scripts/generate-icon.js); regenerate the
      # embedded .ico + the marketing-site favicon/og:image/PWA icons so any
      # mark change flows through to packaging and the landing page.
      - name: Regenerate icons + site assets
        run: |
          node scripts/generate-icon.js
          node scripts/generate-icon.js --dark
          node scripts/build-site-assets.js

      # Structural check of the landing page + generated assets on every build.
      - name: Smoke-check the landing page
        run: node scripts/check-site.js

      - uses: actions/upload-artifact@v4
        with:
          name: site-assets
          path: |
            site/favicon.ico
            site/og-image.png
            site/icon-192.png
            site/icon-512.png
            site/apple-touch-icon.png
            site/manifest.json
          if-no-files-found: error

      - name: Build release binaries (engine + GUI)
        run: cargo build --release --bin nextar --bin nextar-gui

      # Run --check-settings against a committed corrupt fixture (must exit
      # non-zero) and a valid fixture (must exit 0), plus the live path, so
      # a broken settings file or a regressed flag is caught early.
      - name: check-settings gate (corrupt fixture flagged)
        shell: pwsh
        run: |
          $corrupt = "tests/fixtures/settings/corrupt.json"
          $valid   = "tests/fixtures/settings/v3-current.json"
          & "target/release/nextar-gui.exe" --check-settings $corrupt 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 1) { throw "corrupt fixture not flagged (exit $LASTEXITCODE)" }
          & "target/release/nextar-gui.exe" --check-settings $valid 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "valid fixture rejected (exit $LASTEXITCODE)" }
          & "target/release/nextar-gui.exe" --check-settings 2>&1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "live-path check failed (exit $LASTEXITCODE)" }
          Write-Host "check-settings gate OK"

      - name: Build installer wizard
        run: cargo build --release --manifest-path setup/Cargo.toml

      - name: Run unit + integration tests
        run: |
          cargo test
          cargo test --manifest-path setup/Cargo.toml

      # Settings migration coverage: load the historical settings.json
      # fixtures (tests/fixtures/settings/) and assert old values survive
      # while newer fields fall back to defaults.
      - name: Settings migration tests (historical fixtures)
        run: cargo test --bin nextar-gui settings

      - name: Lint
        run: |
          cargo clippy --all-targets
          cargo clippy --all-targets --manifest-path setup/Cargo.toml

      # Registers the HKCU Explorer verbs + .next association + SendTo
      # shortcut for the runner user, pointing at the temp prefix.
      - name: Install to temp prefix (registers shell integration)
        shell: pwsh
        run: |
          setup/target/release/nextar-setup.exe --quiet --prefix "$env:RUNNER_TEMP\nextar-ci"

      - name: Shell verification - registry + Explorer + invoked verbs
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-shell.ps1 -Run -InstallDir "$env:RUNNER_TEMP\nextar-ci"

      - name: Scheduled smoke-test runner (deep)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-shell-test.ps1 -Deep -InstallDir "$env:RUNNER_TEMP\nextar-ci"

      # Isolated installer lifecycle: install → upgrade → uninstall into a
      # throwaway prefix using --no-shell, so the payload path is exercised
      # without disturbing the shell integration registered above. The E2E
      # snapshots the uninstall entry + Start Menu shortcut and asserts they
      # are untouched by the cycle.
      - name: Installer E2E - install, upgrade, uninstall
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-shell.ps1 -Installer -OnlyInstaller -SetupExe "setup\target\release\nextar-setup.exe"

      # Full lifecycle on this ephemeral runner: install WITH shell
      # integration, upgrade in place (asserting settings.json survives),
      # then uninstall. Runs last because it clobbers the global shell verbs.
      - name: Installer E2E - full install, upgrade (settings preserved), uninstall
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-shell.ps1 -Installer -Full -OnlyInstaller -SetupExe "setup\target\release\nextar-setup.exe"

  # macOS: cross-platform packaging. The engine + GUI are fully portable
  # (Windows-only bits - registry theme detection, DWM title bar/corners,
  # shell integration - are #[cfg(windows)] and compile away); the .dmg
  # must be produced on macOS (hdiutil/codesign), so this runs on a Mac.
  macos-package:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --bin nextar --bin nextar-gui

      # Same settings-schema gate as the Windows job: the committed corrupt
      # fixture must exit non-zero, a valid fixture must exit 0, and the live
      # path must be clean - so a regressed --check-settings is caught on the
      # Mac too. Uses `if` (not `test $?`) because GitHub's default bash -e
      # would otherwise abort on the expected non-zero exit.
      - name: check-settings gate (corrupt fixture flagged)
        run: |
          if target/release/nextar-gui --check-settings tests/fixtures/settings/corrupt.json > /dev/null 2>&1; then
            echo "corrupt fixture not flagged"; exit 1
          fi
          if ! target/release/nextar-gui --check-settings tests/fixtures/settings/v3-current.json > /dev/null 2>&1; then
            echo "valid fixture rejected"; exit 1
          fi
          if ! target/release/nextar-gui --check-settings > /dev/null 2>&1; then
            echo "live-path check failed"; exit 1
          fi
          echo "check-settings gate OK"

      - name: Run tests (macOS)
        run: cargo test

      - name: Build the .dmg pipeline
        run: bash installers/macos/build-dmg.sh

      # Packaging lifecycle: mount the dmg, install nextar.app + the CLI
      # into a throwaway Applications dir, upgrade in place, then uninstall.
      - name: Installer E2E - mount, install, upgrade, uninstall
        run: |
          DMG=$(ls dist/*.dmg)
          echo "artifact: $DMG"
          bash installers/macos/verify-install.sh "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: nextar-macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  # Exercises the release workflow's cross-version upgrade opt-out without a
  # 25-minute release build. resolve-prev-stable.ps1 is the same script the
  # release workflow calls; -PrevTag bypasses the API so the "no previous
  # stable" and "resolved" branches can be proven fast on every push/PR.
  first-release-optout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the first-release opt-out path
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Simulate a repo with no previous stable release.
          $out = scripts/resolve-prev-stable.ps1 -Tag v0.1.0 -PrevTag ''
          if ($out -ne 'NONE') { throw "expected NONE without opt-out, got '$out'" }

          # With the opt-out: skip.
          $out = scripts/resolve-prev-stable.ps1 -Tag v0.1.0 -PrevTag '' -AllowNoPrev:$true
          if ($out -ne 'SKIP') { throw "expected SKIP with opt-out, got '$out'" }

          # A real previous tag must resolve and print it.
          $out = scripts/resolve-prev-stable.ps1 -Tag v0.1.1 -PrevTag v0.1.0
          if ($out -ne 'v0.1.0') { throw "expected v0.1.0, got '$out'" }

          # Live API regression check (bypasses -PrevTag): the resolver must
          # actually return a real tag, not NONE, proving the Invoke-RestMethod
          # + filter path still works against the real repo.
          $out = scripts/resolve-prev-stable.ps1 -Tag v999.0.0
          if ($out -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw "live resolve returned unexpected '$out'" }

          Write-Host "first-release opt-out path verified (live: $out)"
