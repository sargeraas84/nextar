name: release

# Two ways to release:
#   1. Push a `v*` tag (e.g. `git tag v0.1.0 && git push origin v0.1.0`) -
#      builds and attaches the Windows installer + macOS dmg at that tag.
#   2. Run this workflow manually with a `version` input (e.g. `0.2.0`) -
#      bumps Cargo.toml + the installer's version, commits, tags v0.2.0,
#      pushes, then builds and releases in the same run.
#
# The manual path pushes with the repo-scoped GITHUB_TOKEN, which GitHub does
# NOT let trigger other workflows - so this workflow creates the release
# itself instead of relying on the tag-push trigger.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.0). Bumps Cargo.toml, tags v0.2.0, builds and releases.'
        required: true

permissions:
  contents: write
  actions: read # the SignPath action downloads the workflow artifact for signing

jobs:
  # Version bump + tag, only for the manual path. The job always runs (so
  # dependents aren't skipped); its steps are no-ops on tag pushes.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version, commit, and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          V="${{ github.event.inputs.version }}"
          V="${V#v}"
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "version must look like 0.2.0, got '$V'" >&2
            exit 1
          fi
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "tag v$V already exists" >&2
            exit 1
          fi
          sed -i "s/^version = \".*\"/version = \"$V\"/" Cargo.toml setup/Cargo.toml
          sed -i "s/const VERSION: &str = \"[^\"]*\"/const VERSION: \&str = \"$V\"/" setup/src/main.rs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$V"
          git push origin master
          git tag "v$V"
          git push origin "v$V"
          echo "released v$V" >> "$GITHUB_STEP_SUMMARY"

  windows:
    runs-on: windows-latest
    needs: prepare
    # Secrets can't be read directly in `if:` conditions, so expose them as
    # job-level env vars; the signing/verify steps check these instead.
    env:
      CODE_SIGN_PFX: ${{ secrets.CODE_SIGN_PFX }}
      CODE_SIGN_PFX_PASS: ${{ secrets.CODE_SIGN_PFX_PASS }}
      # Free OSS signing via SignPath Foundation (signpath.org): when these
      # are set, artifacts are signed by SignPath's CA-issued cert instead of
      # the self-signed/PFX fallback.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORG_ID: ${{ secrets.SIGNPATH_ORG_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      # The setup crate embeds target/release/nextar.exe + nextar-gui.exe via
      # include_bytes!, so build the payload before running its tests (package.sh
      # reuses this cache).
      - name: Run tests before shipping
        run: |
          cargo build --release --bin nextar --bin nextar-gui
          cargo test
          cargo test --manifest-path setup/Cargo.toml

      # Timeout: package.sh historically hung on the (now CI-skipped) signing
      # step; the cap turns any future hang into a visible failure instead of
      # a 6h runner bill.
      - name: Build installer distribution
        shell: bash
        timeout-minutes: 40
        run: bash scripts/package.sh

      # Code-sign the payload when a signing cert is configured. The cert must
      # be a code-signing cert whose private key is importable from a base64
      # PFX (e.g. Azure Code Signing, DigiCert Key Vault, or any exported
      # .pfx). Without the secrets the release still builds — it ships
      # unsigned. Secrets: CODE_SIGN_PFX (base64 .pfx) + CODE_SIGN_PFX_PASS.
      - name: Code-sign installer and binaries
        if: env.CODE_SIGN_PFX != ''
        shell: pwsh
        timeout-minutes: 15
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX))
          $pwd = ConvertTo-SecureString -String $env:CODE_SIGN_PFX_PASS -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Write-Host "imported cert: $($cert.Subject) thumbprint $($cert.Thumbprint)"
          # Only numeric SDK version dirs (arm64/arm breaks the [version] cast).
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Directory |
            Where-Object { $_.Name -match '^\d+\.' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1
          if (-not $signtool) { throw "signtool not found" }
          foreach ($f in @("dist\nextar.exe", "dist\nextar-gui.exe", "dist\nextar-setup.exe")) {
            & $signtool sign /fd SHA256 /sha1 $cert.Thumbprint /tr http://timestamp.digicert.com /td SHA256 $f
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on $f" }
          }
          Write-Host "signed 3 artifacts"

      # --- Free OSS signing via SignPath Foundation (signpath.org) ---
      # When the SIGNPATH_* secrets are set, artifacts are signed by
      # SignPath's CA-issued certificate instead of the self-signed/PFX
      # fallback: upload each exe as a workflow artifact, submit a signing
      # request, download the signed file back. No PFX and no private key to
      # protect - the key never leaves SignPath. Their connector verifies the
      # build ran on GitHub-hosted runners, which ours does.
      - name: Upload nextar-setup.exe for SignPath
        id: upload-setup
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: sign-setup
          path: dist/nextar-setup.exe
          archive: false
          if-no-files-found: error

      - name: Sign nextar-setup.exe via SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/setup
          skip-decompress: true

      - name: Upload nextar-gui.exe for SignPath
        id: upload-gui
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: sign-gui
          path: dist/nextar-gui.exe
          archive: false
          if-no-files-found: error

      - name: Sign nextar-gui.exe via SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-gui.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/gui
          skip-decompress: true

      - name: Upload nextar.exe for SignPath
        id: upload-cli
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: sign-cli
          path: dist/nextar.exe
          archive: false
          if-no-files-found: error

      - name: Sign nextar.exe via SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-cli.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed/cli
          skip-decompress: true

      - name: Move SignPath-signed binaries into dist
        if: env.SIGNPATH_API_TOKEN != ''
        shell: bash
        run: |
          cp signed/setup/* dist/nextar-setup.exe
          cp signed/gui/* dist/nextar-gui.exe
          cp signed/cli/* dist/nextar.exe
          ls -la dist/

      # Gate: when signing was configured (SignPath or PFX), the artifacts
      # MUST carry a valid Authenticode signature or the release is refused
      # (a silently unsigned release would defeat the whole point of the
      # step above).
      #
      # SignPath path: their CA-issued cert is trusted on Windows runners,
      # so Status must be Valid, and the signer must NOT be the self-signed
      # 'Michael Rieger' fallback cert (which would mean the SignPath step
      # silently didn't run).
      #
      # PFX path nuance: a self-signed cert reports 'UnknownError' on a
      # runner that doesn't have it in the root store - that is a
      # trust-chain status, NOT a broken signature. What proves the
      # signature is intact is (a) the signer thumbprint matching the cert
      # we just imported and (b) status NOT being NotSigned/HashMismatch
      # (the two statuses that mean the signature itself is absent or
      # corrupt).
      - name: Verify Authenticode signatures
        if: env.CODE_SIGN_PFX != '' || env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          $useSignPath = $env:SIGNPATH_API_TOKEN -ne ''
          if ($useSignPath) {
            $bad = @()
            foreach ($f in @("dist\nextar.exe", "dist\nextar-gui.exe", "dist\nextar-setup.exe")) {
              $sig = Get-AuthenticodeSignature $f
              $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { 'unsigned' }
              Write-Host ("{0}: {1} ({2})" -f $f, $sig.Status, $subject)
              if ($sig.Status -ne 'Valid') { $bad += $f }
              elseif ($subject -like '*Michael Rieger*') { $bad += $f }
            }
            if ($bad.Count -gt 0) {
              Write-Error ("unsigned/invalid artifacts (SignPath): " + ($bad -join ', '))
              exit 1
            }
            Write-Host "all 3 artifacts carry Valid SignPath signatures"
          } else {
            $pfx = Join-Path $env:RUNNER_TEMP "codesign.pfx"
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:CODE_SIGN_PFX))
            $pwd = ConvertTo-SecureString -String $env:CODE_SIGN_PFX_PASS -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
            $bad = @()
            foreach ($f in @("dist\nextar.exe", "dist\nextar-gui.exe", "dist\nextar-setup.exe")) {
              $sig = Get-AuthenticodeSignature $f
              $subject = if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { 'unsigned' }
              $thumb = if ($sig.SignerCertificate) { $sig.SignerCertificate.Thumbprint } else { 'none' }
              Write-Host ("{0}: {1} ({2}) thumb {3}" -f $f, $sig.Status, $subject, $thumb)
              $broken = $sig.Status -in @('NotSigned', 'HashMismatch', 'NotTrusted', 'Invalid')
              if ($broken -or $thumb -ne $cert.Thumbprint) { $bad += $f }
            }
            if ($bad.Count -gt 0) {
              Write-Error ("unsigned/invalid artifacts: " + ($bad -join ', '))
              exit 1
            }
            Write-Host "all 3 artifacts carry valid Authenticode signatures (signer thumbprint matches imported cert)"
          }

      # Release gate: the full installer lifecycle must pass before the
      # artifacts are attached to the release. Two legs: an in-place
      # install/upgrade/uninstall of this build, plus (when a previous
      # stable release exists) a cross-version upgrade from it, so every
      # cut is proven to upgrade cleanly from the prior stable version.
      - name: Download previous stable installer (upgrade-from leg)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          # releases/latest returns the newest non-draft, non-prerelease
          # release. The nightly is marked prerelease, and the release being
          # cut isn't published until the `release` job (which needs windows +
          # macos to finish first), so this is always the previous stable.
          # Invoke-RestMethod is used instead of `gh api --jq`, which returned
          # empty on the Windows runner (native-arg/jq parsing flakiness).
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "nextar-release-ci" }
          $latest = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/${{ github.repository }}/releases/latest"
          $prev = $latest.tag_name
          if (-not $prev -or $prev -eq $tag) {
            Write-Host "No previous stable release found - the cross-version leg will be skipped."
            exit 0
          }
          Write-Host "Previous stable release: $prev"
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/$prev/nextar-setup.exe" -OutFile "$env:RUNNER_TEMP\prev-setup.exe"
          Write-Host "Downloaded previous installer: $((Get-Item "$env:RUNNER_TEMP\prev-setup.exe").Length) bytes"

      - name: Installer E2E - in-place + cross-version upgrade
        shell: pwsh
        run: |
          $common = @('-NoProfile','-ExecutionPolicy','Bypass','-File','scripts/verify-shell.ps1','-Installer','-Full','-OnlyInstaller','-SetupExe',"dist\nextar-setup.exe")
          & powershell.exe @common
          if ($LASTEXITCODE -ne 0) { throw "in-place installer E2E failed (exit $LASTEXITCODE)" }
          Write-Host "in-place E2E passed"
          if (Test-Path "$env:RUNNER_TEMP\prev-setup.exe") {
            Write-Host "running cross-version upgrade E2E (-UpgradeFrom previous stable)..."
            & powershell.exe @common '-UpgradeFrom' "$env:RUNNER_TEMP\prev-setup.exe"
            if ($LASTEXITCODE -ne 0) { throw "cross-version upgrade E2E failed (exit $LASTEXITCODE)" }
            Write-Host "cross-version upgrade E2E passed"
          } else {
            Write-Host "no previous stable - skipped the cross-version leg"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/nextar-setup.exe
            dist/nextar.exe
            dist/nextar-gui.exe

  macos:
    runs-on: macos-latest
    needs: prepare
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', github.event.inputs.version) || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - name: Run tests before shipping
        run: cargo test

      - name: Build the .dmg
        run: bash installers/macos/build-dmg.sh

      # Release gate: the macOS install lifecycle (including a brief GUI
      # launch) must pass before the .dmg is attached to the release.
      - name: Installer E2E - mount, install, upgrade, uninstall
        run: |
          DMG=$(ls dist/*.dmg)
          bash installers/macos/verify-install.sh "$DMG"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg

  release:
    runs-on: ubuntu-latest
    needs: [windows, macos]
    # Only used to decide whether the body may mention SignPath Foundation
    # (the download page must state it once SignPath signing is active).
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: assets/
      - uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: assets/

      # Compute SHA-256 for every artifact and assemble the release body with
      # the checksums appended (same `name: <sha>` lines the nightly body
      # carries), so the landing page's stable card can show and verify them
      # exactly like the nightly cards do.
      - name: Checksum artifacts and assemble release body
        shell: bash
        run: |
          set -euo pipefail
          DMG=$(ls assets/nextar-*.dmg)
          WIN_SHA=$(sha256sum assets/nextar-setup.exe | awk '{print $1}')
          GUI_SHA=$(sha256sum assets/nextar-gui.exe | awk '{print $1}')
          CLI_SHA=$(sha256sum assets/nextar.exe | awk '{print $1}')
          DMG_SHA=$(sha256sum "$DMG" | awk '{print $1}')
          cat > body.md <<EOF
          Created by **Michael Rieger** — a next-generation archiver built to dethrone WinRAR and 7-Zip.

          **Highlights**
          - ⚡ Zstd (fast) + LZMA2 (ultra) compression
          - 🔐 Argon2id + XChaCha20-Poly1305 authenticated encryption
          - 🛡️ Reed-Solomon recovery volumes (self-healing archives)
          - 🧵 Fully multi-threaded read → compress → encrypt → write pipeline
          - 🖥️ GUI with drag-and-drop, live progress, and Windows Explorer shell integration

          **Installer** — the Windows setup wizard (with a macOS .dmg) bundles both the CLI and the GUI. Full install → upgrade → uninstall lifecycle is verified in CI before shipping.

          **Checksums (SHA-256)**
          - nextar-setup.exe: ${WIN_SHA}
          - nextar-gui.exe: ${GUI_SHA}
          - nextar.exe: ${CLI_SHA}
          - $(basename "$DMG"): ${DMG_SHA}
          EOF
          # Required by the SignPath Foundation program: the download page
          # (GitHub Releases) must state that code signing is provided by
          # SignPath. Only claimed while SignPath signing is actually active.
          # (SPEOF terminator: a second 'EOF' inside the outer heredoc would
          # terminate it early.)
          if [ -n "${SIGNPATH_API_TOKEN:-}" ]; then
            cat >> body.md <<SPEOF

          Free code signing provided by SignPath.io, certificate by SignPath Foundation.
          SPEOF
          fi
          echo "--- body.md ---"
          cat body.md

      - name: Create GitHub release with artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: nextar ${{ github.event_name == 'workflow_dispatch' && format('v{0}', github.event.inputs.version) || github.ref_name }}
          body_path: ${{ github.workspace }}/body.md
          generate_release_notes: true
          # Never silently ship an empty release: fail loudly if any expected
          # artifact is missing from the download step.
          fail_on_unmatched_files: true
          files: |
            assets/nextar-setup.exe
            assets/nextar.exe
            assets/nextar-gui.exe
            assets/nextar-*.dmg
