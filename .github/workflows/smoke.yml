name: smoke

# Daily scheduled smoke run against the ACTUAL shipped nightly build, on
# dedicated runners. CI rebuilds from source; this instead downloads the
# installers from the `nightly` release and drives the real packaging
# against them:
#   - macOS job: mounts the shipped .dmg, installs nextar.app + CLI, launches
#     the GUI, upgrades in place, then uninstalls (verify-install.sh).
#   - Windows job: installs the shipped setup.exe to a temp prefix and drives
#     the real Explorer shell integration - registry verbs, verb resolution,
#     actual verb invocations (compress / extract / repair, encrypted-
#     repair), and the deep scenario runner.
# The macOS job runs FIRST and gates the Windows job, so a broken dmg aborts
# the run before the (expensive) Windows smoke starts. Runs ~1h after the
# nightly build so the release is fresh; also triggerable manually.

on:
  schedule:
    - cron: '47 5 * * *' # daily at 05:47 UTC, after nightly (04:37) + CI
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # macOS first: cheap (~2 min) and gates the Windows job below.
  macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Same freshness guard as the Windows job, against the dmg asset.
      - name: Assert the nightly dmg is fresh
        shell: bash
        run: |
          # Asset updated_at, NOT release published_at: the nightly release
          # is updated in place, so published_at stays at first creation while
          # the assets are replaced each build.
          asset=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.assets[] | select(.name == "nextar-macos.dmg") | .updated_at')
          [ -n "$asset" ] || { echo "::error::nightly nextar-macos.dmg not found"; exit 1; }
          published=$(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$asset" +%s)
          now=$(date +%s)
          age_h=$(( (now - published) / 3600 ))
          echo "nightly nextar-macos.dmg updated: $asset (age ${age_h}h)"
          [ "$age_h" -le 26 ] || { echo "::error::nightly dmg is ${age_h}h old - nightly likely failed"; exit 1; }

      - name: Download the latest nightly dmg
        shell: bash
        run: |
          curl -fL -o "$RUNNER_TEMP/nextar-macos.dmg" "https://github.com/${{ github.repository }}/releases/download/nightly/nextar-macos.dmg"
          ls -la "$RUNNER_TEMP/nextar-macos.dmg"

      # Mounts the dmg, installs nextar.app + CLI to a throwaway dir, launches
      # the GUI briefly (time-bounded), upgrades in place, then uninstalls.
      - name: dmg install / launch / upgrade / uninstall E2E
        shell: bash
        run: bash installers/macos/verify-install.sh "$RUNNER_TEMP/nextar-macos.dmg"

  nightly-shell:
    runs-on: windows-latest
    needs: macos-dmg
    steps:
      - uses: actions/checkout@v4

      # The stable nightly release URL: fixed asset names, updated in place
      # by the nightly workflow, so this always tests the newest build.
      #
      # Schedule alignment: the nightly workflow builds at 04:37 UTC and
      # publishes ~05:01 UTC (windows job ~24 min), and this smoke runs at
      # 05:47 UTC - a ~46 min buffer so it always exercises a fresh release.
      #
      # Guard: if the nightly pipeline ever fails, this refuses to silently
      # smoke-test a stale artifact (the previous day's build) instead of
      # the newest one.
      - name: Assert the nightly release is fresh
        shell: pwsh
        run: |
          # Use the asset's updated_at, NOT the release's published_at: the
          # nightly release is updated IN PLACE on every build, so published_at
          # stays at the original creation time while the assets are replaced.
          $asset = gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.assets[] | select(.name == "nextar-setup.exe") | .updated_at' 2>$null
          if (-not $asset) { throw "nightly nextar-setup.exe asset not found - cannot smoke-test" }
          $published = [DateTime]::Parse($asset)
          $age = (Get-Date).ToUniversalTime() - $published
          Write-Host "nightly nextar-setup.exe updated: $published (age $([math]::Round($age.TotalHours,1))h)"
          if ($age.TotalHours -gt 26) {
            throw "nightly installer is $([math]::Round($age.TotalHours,1))h old - the nightly workflow likely failed. Refusing to smoke-test a stale artifact."
          }

      - name: Download the latest nightly installer
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/nightly/nextar-setup.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\nextar-setup.exe"
          Get-Item "$env:RUNNER_TEMP\nextar-setup.exe" | Select-Object Name, Length

      # Registers the HKCU Explorer verbs + .next association + SendTo
      # shortcut for the runner user, pointing at the temp prefix.
      - name: Install to temp prefix (registers shell integration)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\nextar-setup.exe" --quiet --prefix "$env:RUNNER_TEMP\nextar-smoke"

      - name: Shell verification - registry + Explorer + invoked verbs
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-shell.ps1 -Run -InstallDir "$env:RUNNER_TEMP\nextar-smoke"

      - name: Deep smoke-test runner
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-shell-test.ps1 -Deep -InstallDir "$env:RUNNER_TEMP\nextar-smoke"
