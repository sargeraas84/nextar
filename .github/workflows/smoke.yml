name: smoke

# Daily scheduled smoke run against the ACTUAL shipped nightly build, on
# dedicated runners. CI rebuilds from source; this instead downloads the
# installers from the `nightly` release and drives the real packaging
# against them:
#   - macOS job: mounts the shipped .dmg, installs nextar.app + CLI, launches
#     the GUI, upgrades in place, then uninstalls (verify-install.sh).
#   - Windows job: installs the shipped setup.exe to a temp prefix and drives
#     the real Explorer shell integration - registry verbs, verb resolution,
#     actual verb invocations (compress / extract / repair, encrypted-
#     repair), and the deep scenario runner.
# The macOS job runs FIRST and gates the Windows job, so a broken dmg aborts
# the run before the (expensive) Windows smoke starts. Runs ~1h after the
# nightly build so the release is fresh; also triggerable manually. On
# completion (even on failure) a report job posts the per-job results to the
# nightly release so a failed daily smoke is visible on the release page.

on:
  schedule:
    - cron: '47 5 * * *' # daily at 05:47 UTC, after nightly (04:37) + CI
  workflow_dispatch:

permissions:
  # contents: write so the report job can append the daily smoke results to
  # the nightly release body; issues: write so it can also post a dated entry
  # to the dedicated "Daily smoke log" issue (the release-comments REST API
  # was removed by GitHub, so issues + body are the available channels).
  contents: write
  issues: write

jobs:
  # macOS first: cheap (~2 min) and gates the Windows job below.
  macos-dmg:
    runs-on: macos-latest
    outputs:
      summary: ${{ steps.e2e.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      # Half-publish guard: BOTH assets must be fresh AND replaced in the
      # same build. The nightly publish job uploads the exe and dmg seconds
      # apart, so if one asset is hours older than the other the release was
      # only partially published (e.g. a build leg failed) and we must not
      # smoke-test it. Uses each asset's updated_at, NOT release published_at
      # (which stays at first creation for an in-place updated release).
      - name: Assert both nightly assets are fresh and from the same build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe_ts=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.assets[] | select(.name == "nextar-setup.exe") | .updated_at')
          dmg_ts=$(gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.assets[] | select(.name == "nextar-macos.dmg") | .updated_at')
          [ -n "$exe_ts" ] || { echo "::error::nightly nextar-setup.exe not found"; exit 1; }
          [ -n "$dmg_ts" ] || { echo "::error::nightly nextar-macos.dmg not found"; exit 1; }
          exe_s=$(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$exe_ts" +%s)
          dmg_s=$(date -j -f "%Y-%m-%dT%H:%M:%SZ" "$dmg_ts" +%s)
          now=$(date +%s)
          exe_age=$(( (now - exe_s) / 3600 ))
          dmg_age=$(( (now - dmg_s) / 3600 ))
          echo "nextar-setup.exe updated: $exe_ts (age ${exe_age}h)"
          echo "nextar-macos.dmg  updated: $dmg_ts (age ${dmg_age}h)"
          [ "$exe_age" -le 26 ] || { echo "::error::nextar-setup.exe is ${exe_age}h old - nightly likely failed"; exit 1; }
          [ "$dmg_age" -le 26 ] || { echo "::error::nextar-macos.dmg is ${dmg_age}h old - nightly likely failed"; exit 1; }
          delta=$(( dmg_s - exe_s ))
          [ "$delta" -lt 0 ] && delta=$(( -delta ))
          echo "assets updated ${delta}s apart (same build expects < 600s)"
          [ "$delta" -le 600 ] || { echo "::error::assets were NOT published in the same build (${delta}s apart) - half-published release"; exit 1; }

      - name: Download the latest nightly dmg
        shell: bash
        run: |
          curl -fL -o "$RUNNER_TEMP/nextar-macos.dmg" "https://github.com/${{ github.repository }}/releases/download/nightly/nextar-macos.dmg"
          ls -la "$RUNNER_TEMP/nextar-macos.dmg"

      # Mounts the dmg, installs nextar.app + CLI to a throwaway dir, launches
      # the GUI briefly (time-bounded), upgrades in place, then uninstalls.
      # The summary line ("N passed, M failed") is captured for the report job.
      - name: dmg install / launch / upgrade / uninstall E2E
        id: e2e
        shell: bash
        run: |
          set +e
          out=$(bash installers/macos/verify-install.sh "$RUNNER_TEMP/nextar-macos.dmg" 2>&1)
          code=$?
          set -e
          printf '%s\n' "$out"
          summary=$(printf '%s\n' "$out" | grep -E '^[0-9]+ passed' | tail -n 1 || true)
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          exit $code

  nightly-shell:
    runs-on: windows-latest
    needs: macos-dmg
    outputs:
      deep: ${{ steps.deep.outputs.summary }}
    steps:
      - uses: actions/checkout@v4

      # The stable nightly release URL: fixed asset names, updated in place
      # by the nightly workflow, so this always tests the newest build.
      #
      # Schedule alignment: the nightly workflow builds at 04:37 UTC and
      # publishes ~05:01 UTC (windows job ~24 min), and this smoke runs at
      # 05:47 UTC - a ~46 min buffer so it always exercises a fresh release.
      #
      # Guard: if the nightly pipeline ever fails, this refuses to silently
      # smoke-test a stale artifact (the previous day's build) instead of
      # the newest one.
      - name: Assert the nightly release is fresh
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use the asset's updated_at, NOT the release's published_at: the
          # nightly release is updated IN PLACE on every build, so published_at
          # stays at the original creation time while the assets are replaced.
          $asset = gh api "repos/${{ github.repository }}/releases/tags/nightly" --jq '.assets[] | select(.name == "nextar-setup.exe") | .updated_at' 2>$null
          if (-not $asset) { throw "nightly nextar-setup.exe asset not found - cannot smoke-test" }
          $published = [DateTime]::Parse($asset)
          $age = (Get-Date).ToUniversalTime() - $published
          Write-Host "nightly nextar-setup.exe updated: $published (age $([math]::Round($age.TotalHours,1))h)"
          if ($age.TotalHours -gt 26) {
            throw "nightly installer is $([math]::Round($age.TotalHours,1))h old - the nightly workflow likely failed. Refusing to smoke-test a stale artifact."
          }

      - name: Download the latest nightly installer
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/nightly/nextar-setup.exe"
          Invoke-WebRequest $url -OutFile "$env:RUNNER_TEMP\nextar-setup.exe"
          Get-Item "$env:RUNNER_TEMP\nextar-setup.exe" | Select-Object Name, Length

      # Registers the HKCU Explorer verbs + .next association + SendTo
      # shortcut for the runner user, pointing at the temp prefix.
      - name: Install to temp prefix (registers shell integration)
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP\nextar-setup.exe" --quiet --prefix "$env:RUNNER_TEMP\nextar-smoke"

      - name: Shell verification - registry + Explorer + invoked verbs
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-shell.ps1 -Run -InstallDir "$env:RUNNER_TEMP\nextar-smoke"

      - name: Deep smoke-test runner
        id: deep
        shell: pwsh
        run: |
          $out = powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run-shell-test.ps1 -Deep -InstallDir "$env:RUNNER_TEMP\nextar-smoke" 2>&1
          $code = $LASTEXITCODE
          $out | ForEach-Object { Write-Host $_ }
          $summary = ($out | Select-String -Pattern '^\s*\d+ passed, \d+ failed' | Select-Object -Last 1).Line
          "summary=$summary" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          exit $code

      # Daily upgrade test: install the latest STABLE release first, then
      # upgrade in place with the shipped nightly, proving the rolling build
      # upgrades cleanly from the previous stable while preserving settings.
      # The nightly and the latest stable share the same version string until
      # the next cut, so -AllowSameVersion keeps the upgrade checks running
      # (the version-crossing assertion is only meaningful for releases). The
      # -Full E2E's finally-block restores the nextar-smoke shell state after.
      - name: Download previous stable installer (upgrade-from leg)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Reuse the release workflow's resolver (with its API retry) instead
          # of an inline gh call, so a transient 503 can't drop the daily
          # upgrade leg.
          $prev = scripts/resolve-prev-stable.ps1 -Tag nightly -AllowNoPrev:$true
          if ($prev -eq 'NONE' -or $prev -eq 'SKIP') {
            Write-Host "no previous stable release - upgrade leg skipped"
            exit 0
          }
          Write-Host "Previous stable release: $prev"
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/$prev/nextar-setup.exe" -OutFile "$env:RUNNER_TEMP\prev-stable-setup.exe"
          Write-Host "Downloaded: $((Get-Item "$env:RUNNER_TEMP\prev-stable-setup.exe").Length) bytes"

      - name: Cross-version upgrade E2E (stable -> nightly)
        shell: pwsh
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\prev-stable-setup.exe")) {
            Write-Host "no previous stable - upgrade leg skipped"
            exit 0
          }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-shell.ps1 -Installer -Full -OnlyInstaller -AllowSameVersion -SetupExe "$env:RUNNER_TEMP\nextar-setup.exe" -UpgradeFrom "$env:RUNNER_TEMP\prev-stable-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "cross-version upgrade E2E failed (exit $LASTEXITCODE)" }
          Write-Host "cross-version upgrade E2E passed"

  # Always runs (even when a job failed/skipped) and records the per-job
  # results in two places:
  #   1. the nightly release BODY (visible on the release page), and
  #   2. a dedicated "Daily smoke log" issue - the canonical, append-only
  #      history that survives the nightly workflow rewriting the body each
  #      build. (GitHub removed the release-comments REST API - every
  #      /releases/{id}/comments endpoint returns 404 - so issues are the
  #      appendable channel; the site's badge parser reads the commit + sha
  #      lines above the body's smoke section, so appending there is safe.)
  report:
    runs-on: ubuntu-latest
    needs: [macos-dmg, nightly-shell]
    if: always()
    steps:
      - name: Record smoke results (release body + daily log issue)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          # Retry a gh invocation with exponential backoff so a transient 503
          # on the POST/PATCH mutations doesn't drop the daily smoke log.
          retry_gh() {
            local attempt=1 max=5 delay
            while :; do
              if gh "$@"; then return 0; fi
              if [ "$attempt" -ge "$max" ]; then
                echo "gh $* failed after $max attempts" >&2
                return 1
              fi
              delay=$(( 5 * 2 ** attempt ))
              echo "gh $* failed; retrying in ${delay}s..." >&2
              sleep "$delay"
              attempt=$(( attempt + 1 ))
            done
          }
          RELEASE_ID=$(gh api "repos/$REPO/releases/tags/nightly" --jq '.id')
          COMMIT=$(gh api "repos/$REPO/releases/tags/nightly" --jq '.body' | grep -m1 '^- commit:' | awk '{print $3}')
          MAC=${{ needs.macos-dmg.result }}
          WIN=${{ needs.nightly-shell.result }}
          MAC_SUMMARY="${{ needs.macos-dmg.outputs.summary }}"
          DEEP_SUMMARY="${{ needs.nightly-shell.outputs.deep }}"
          icon() { case "$1" in success) echo '✅';; failure) echo '❌';; *) echo '⚠️ skipped';; esac; }
          DAY=$(date -u +%F)

          # Daily log issue: resolve FIRST (create on first run) so the smoke
          # section in both the release body and the comment can link it. The
          # search API is slow/unreliable here; listing open issues and
          # filtering by exact title in jq is fast and deterministic.
          ISSUE=$(gh api "repos/$REPO/issues?state=open&per_page=100" --jq '[.[] | select(.title == "Daily smoke log")][0].number // empty')
          if [ -z "$ISSUE" ]; then
            retry_gh api --method POST "repos/$REPO/issues" -f title="Daily smoke log" -f body="Canonical, append-only log of the daily scheduled smoke runs against the nightly release. Each run appends a dated entry below." --jq '.number' > /tmp/issue.json
            ISSUE=$(cat /tmp/issue.json)
            echo "created daily log issue #$ISSUE"
          fi

          SMOKE="## Daily smoke results ($DAY)\n\n- run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n- asset commit: \`${COMMIT}\`\n- macOS dmg E2E: $(icon "$MAC") \`$MAC_SUMMARY\`\n- Windows shell E2E: $(icon "$WIN") \`$DEEP_SUMMARY\`\n- full history: #$ISSUE\n"

          # 1) Release body: keep the nightly's original body, dropping any
          #    earlier smoke section (so it reflects today only), then append
          #    today's section which links the canonical log issue.
          ORIG=$(gh api "repos/$REPO/releases/$RELEASE_ID" --jq '.body')
          BASE=$(printf '%s' "$ORIG" | sed '/^## Daily smoke results/,$d' | sed -e :a -e '/^\n*$/{$d;N;};/\n$/ba')
          printf '%s\n\n%s' "$BASE" "$(printf '%b' "$SMOKE")" > /tmp/nightly-body.md
          echo "--- new release body ---"
          cat /tmp/nightly-body.md
          retry_gh api --method PATCH "repos/$REPO/releases/$RELEASE_ID" -f body="$(cat /tmp/nightly-body.md)" --jq '.id' >/dev/null
          echo "body updated on release $RELEASE_ID"

          # 2) Append a dated comment to the daily log issue for the permanent
          #    history (the release body is rewritten nightly).
          retry_gh api --method POST "repos/$REPO/issues/$ISSUE/comments" -f body="$(printf '%b' "$SMOKE")" --jq '.html_url'
          echo "logged to issue #$ISSUE"
